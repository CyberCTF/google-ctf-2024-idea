# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# IDEA (Google's 2024 security competition, by Google; a crypto challenge) as an Isoloom spec:
# a 3-round IDEA service that lets you flip bits of its secret key between encryptions.
# The challenge folder 2024/quals/crypto-idea of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-idea

networks:
  lab: { cidr: 10.60.189.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server shows its menu
    script: checks/probe.sh
    wait: 60

message: |
  IDEA (Google, 2024) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  You choose how the key is changed: what do related keys tell you about IDEA's key schedule?
